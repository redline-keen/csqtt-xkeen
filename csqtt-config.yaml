# --- ОСНОВНЫЕ НАСТРОЙКИ ---
redir-port: 7892
tproxy-port: 7893
allow-lan: true
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

# --- НАСТРОЙКИ UI/ПРОФИЛЯ ---
external-controller: '0.0.0.0:9090'
secret: 'admin'
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
profile:
  store-selected: true
  store-fake-ip: true

# --- SNIFFER ---
sniffer:
  enable: true
  override-destination: false
  parse-pure-ip: true
  force-dns-mapping: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
  skip-dst-address:
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 198.18.0.0/15
    - 169.254.0.0/16
    - 192.168.0.0/16
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - fc00::/7
    - ff00::/8
    - fe80::/10
    - ::/127

# --------------------------------------------------------------------
# --- Секция 1: ПРОВАЙДЕРЫ ПРОКСИ ---
# --------------------------------------------------------------------
proxies:
  - name: CSQTT
    type: direct
    interface-name: csqtt0

# --------------------------------------------------------------------
# --- Секция 2: ГРУППЫ ПРОКСИ ---
# --------------------------------------------------------------------
proxy-groups:
  - name: VPN
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png
    proxies:
      - CSQTT
    url: http://www.gstatic.com/generate_204
    interval: 120
    tolerance: 50

  - name: Github
    type: fallback
    proxies:
      - 🔓 Без VPN
      - VPN
    hidden: true
    url: https://raw.githubusercontent.com/
    interval: 60
    lazy: true

  - name: AI
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/OneDrive.png
    type: select
    hidden: true
    proxies:
      - VPN
    
  - name: 📺 Youtube
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png
    type: select
    proxies:
      - 🔓 Без VPN
      - VPN

  - name: 💬 Discord
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Discord.png
    type: select
    proxies:
      - 🔓 Без VPN
      - VPN
      

  - name: 🎮 Игры
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png
    type: select
    proxies:
      - 🔓 Без VPN
      - VPN

  - name: 🔓 Без VPN
    type: select
    hidden: true
    proxies:
      - DIRECT

  - name: ⛔ Блок
    type: select
    hidden: true
    proxies:
      - REJECT

